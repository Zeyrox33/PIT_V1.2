<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#F2C230"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Karting"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stratégie endurance karting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F3; --panel:#FFFFFF; --panel2:#F6F8F9; --ink:#18222D; --muted:#56636F; --line:#CBD3DA;
  --board:#F2C230; --board-ink:#1A1A12; --good:#1F7A4D; --warn:#9A5B00; --bad:#B3261E; --info:#2B64A8;
  --good-bg:#E3F2EA; --warn-bg:#FBEFD9; --bad-bg:#F9E3E1; --info-bg:#E3ECF7; --sel:#FFF6D6;
  --r1:4px; --r2:8px;
  --fd:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --fb:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161C22; --panel:#1F272F; --panel2:#252E37; --ink:#E7ECF0; --muted:#9AA7B3; --line:#36434F;
  --board:#E9B92A; --board-ink:#17150C; --good:#55C98F; --warn:#F0A43A; --bad:#F2786B; --info:#78AAEB;
  --good-bg:#183327; --warn-bg:#3A2A10; --bad-bg:#3D1C19; --info-bg:#172A42; --sel:#3A3215; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#161C22; --panel:#1F272F; --panel2:#252E37; --ink:#E7ECF0; --muted:#9AA7B3; --line:#36434F;
  --board:#E9B92A; --board-ink:#17150C; --good:#55C98F; --warn:#F0A43A; --bad:#F2786B; --info:#78AAEB;
  --good-bg:#183327; --warn-bg:#3A2A10; --bad-bg:#3D1C19; --info-bg:#172A42; --sel:#3A3215; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;line-height:1.1}
h2{font-size:1.15rem;letter-spacing:.01em}
h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hide{display:none!important}

/* barre supérieure */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 14px;max-width:1920px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto}
.brand h1{font-size:1.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;gap:14px;align-items:baseline;font-family:var(--fd)}
.clock b{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.clock span{font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.link i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.link.live{color:var(--good)} .link.rec{color:var(--warn)} .link.off{color:var(--bad)}
.link.rec i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.link.rec i{animation:none}}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r1);padding:6px 11px;cursor:pointer;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.board{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:30px;padding:3px 8px;font-size:.85rem}
select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:5px 8px;min-height:36px;max-width:100%}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px;max-width:1920px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px 8px;font-family:var(--fd);font-size:1.02rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--board)}
.replaybar{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--sel);border-top:1px solid var(--line);flex-wrap:wrap}
.replaybar input{flex:1 1 200px;accent-color:var(--ink)}

main{max-width:1920px;margin:0 auto;padding:14px}
.grid{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;min-width:0}
.panel>h2,.panel>header{margin-bottom:8px}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* le panneau de stand */
.pitboard{background:var(--board);color:var(--board-ink);border-radius:var(--r2);padding:12px 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:end;border:0}
.pitboard .pos{font-family:var(--fd);font-weight:700;font-size:6.2rem;line-height:.82;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pitboard .lines{display:grid;gap:2px;font-family:var(--fd);font-weight:600;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.pitboard .lines small{font-family:var(--fb);font-weight:500;font-size:.8rem;opacity:.8;margin-right:6px}
.pitboard .foot{grid-column:1/-1;font-size:.85rem;font-weight:500;border-top:2px solid rgba(0,0,0,.25);padding-top:6px;margin-top:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.action{font-family:var(--fd);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:.02em}
.action small{font-size:1.1rem;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:0}
.a-PIT{color:var(--bad)} .a-WAIT{color:var(--warn)} .a-KEEP{color:var(--ink)} .a-PUSH,.a-ATTACK{color:var(--info)} .a-DEFEND{color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:1px 7px;border-radius:var(--r1);border:1px solid currentColor;white-space:nowrap}
.r-LOW,.s-LEGAL{color:var(--good)} .r-MEDIUM,.s-WARNING{color:var(--warn)} .r-HIGH,.s-ILLEGAL{color:var(--bad)} .s-UNKNOWN{color:var(--muted)}
.meter{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ink)}
.stars{letter-spacing:1px;color:var(--warn);white-space:nowrap}
.kartnum{font-family:var(--fd);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.big{font-family:var(--fd);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}

table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.82rem}
td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.us td{background:var(--sel);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tag{font-size:.75rem;font-weight:700;padding:0 5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.pit{background:var(--warn-bg);color:var(--warn);border-color:transparent}

/* tableau de bord */
.dash{grid-template-columns:1fr}
.dash>*{min-width:0}
@media (min-width:1024px){
  .dash{grid-template-columns:minmax(260px,1fr) minmax(380px,1.6fr) minmax(280px,1.1fr);grid-template-areas:"board live strat" "rival live radio" "now now next" "window window window" "tl tl tl"}
  .d-board{grid-area:board}.d-board .pitboard{height:100%;align-content:center}.d-live{grid-area:live}.d-strat{grid-area:strat}.d-rival{grid-area:rival}.d-now{grid-area:now}.d-next{grid-area:next}.d-window{grid-area:window}.d-radio{grid-area:radio}.d-tl{grid-area:tl}
}
.nowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 14px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-family:var(--fd);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.winbar{position:relative;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);margin:6px 0 22px}
.winbar .legal{position:absolute;top:0;bottom:0;background:var(--good-bg);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.winbar .soft{position:absolute;top:0;bottom:0;border-right:2px dashed var(--warn)}
.winbar .opt{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--ink)}
.winbar .lbl{position:absolute;top:100%;font-size:.75rem;white-space:nowrap;transform:translateX(-50%);margin-top:2px;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.88rem;max-height:260px;overflow:auto}
.tl li{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums}

/* karts */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;text-align:left;cursor:pointer;display:grid;gap:2px}
.kcard[aria-expanded="true"]{outline:2px solid var(--ink)}
.kcard .loc{font-size:.78rem;color:var(--muted)}

/* files */
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;min-height:160px;display:flex;flex-direction:column;gap:6px}
.lane.over{outline:3px dashed var(--info);outline-offset:-3px}
.chip{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel2);touch-action:none;user-select:none;cursor:grab}
.chip.head{border-color:var(--ink);border-width:2px}
.chip.drop-before{box-shadow:0 -3px 0 var(--info)}
.chip .q{font-family:var(--fd);font-weight:700;color:var(--muted)}
.chip .mv{grid-column:1/-1;display:flex;gap:4px}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.25);width:200px}

/* rivaux */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.threat-HIGH{border-left:5px solid var(--bad)} .threat-MEDIUM{border-left:5px solid var(--warn)} .threat-LOW{border-left:5px solid var(--line)}

/* notifications */
.toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(360px,calc(100vw - 24px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--info);border-radius:var(--r2);padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:.9rem}
.toast b{display:block}
.sev-WARNING{border-left-color:var(--warn)} .sev-CRITICAL{border-left-color:var(--bad)} .sev-ERROR{border-left-color:var(--bad)}
.notes{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.notes li{border-left:4px solid var(--info);padding:4px 8px;background:var(--panel2);border-radius:0 var(--r1) var(--r1) 0;font-size:.88rem}

/* mode course */
.racemode{position:fixed;inset:0;z-index:80;background:var(--paper);padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,1fr);overflow:auto}
@media (min-width:900px){.racemode{grid-template-columns:repeat(4,1fr)}}
.rm{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-height:110px}
.rm small{color:var(--muted);font-size:.95rem}
.rm b{font-family:var(--fd);font-weight:700;font-size:clamp(2rem,7vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.rm.board{background:var(--board);color:var(--board-ink);border:0}
.rm.board small{color:inherit;opacity:.8}
.rm.wide{grid-column:span 2}
.rm.alert{border:3px solid var(--bad)}
.rm-exit{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:81}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.form label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
.form label input,.form label select{color:var(--ink)}
.form .check{display:flex;gap:8px;align-items:center;color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;margin:0 0 12px}
legend{font-family:var(--fd);font-weight:600;font-size:1.05rem;padding:0 6px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.cols2{display:grid;gap:12px}
@media (min-width:900px){.cols2{grid-template-columns:1fr 1fr}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.distbar{display:flex;height:22px;border-radius:var(--r1);overflow:hidden;border:1px solid var(--line)}
.distbar span{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--panel);background:var(--ink);border-right:1px solid var(--panel)}
@media (max-width:600px){
  main{padding:10px}
  .pitboard .pos{font-size:5rem}
  .clock b{font-size:1.35rem}
  .action{font-size:2.1rem}
  .hide-sm{display:none}
  .top{position:static}
  .top-in{gap:6px 10px;padding:8px 10px}
  .brand h1{font-size:1.15rem}
  .clock{gap:10px}
  .ctrls{width:100%;gap:5px}
  .ctrls .btn,.ctrls select{min-height:34px;padding:4px 9px;font-size:.88rem}
  .ctrls label .muted{display:none}
  .toast:nth-child(n+2){display:none}
  .toasts{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}

/* choix du rôle, radio */
.driver{display:none}
body.driver-mode .top,body.driver-mode main,body.driver-mode .toasts{display:none}
.rolepick{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.rp-in{max-width:520px;width:100%;display:grid;gap:12px}
.rp-in h1{font-size:2rem}
.rp-btn{display:grid;gap:4px;text-align:left;padding:16px;border:2px solid var(--line);border-radius:var(--r2);background:var(--panel);cursor:pointer;font:inherit;color:inherit;width:100%}
.rp-btn b{font-family:var(--fd);font-size:1.6rem;line-height:1.1}
.rp-btn.board{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.quick{display:flex;flex-wrap:wrap;gap:5px}
pre.code{background:var(--panel2);border:1px solid var(--line);padding:8px;border-radius:var(--r1);overflow:auto;font-size:.8rem}
details summary{cursor:pointer}

/* écran pilote : tout tient sur un écran, sans défilement */
html:has(body.driver-mode),body.driver-mode{height:100%;overflow:hidden;overscroll-behavior:none}
body.driver-mode{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.driver-mode .driver{display:block;position:fixed;inset:0;padding:calc(6px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));overflow:hidden;background:var(--paper)}
.dv-wait{height:100%;overflow:auto;padding:30px 10px;text-align:center;display:grid;gap:12px;align-content:center;max-width:520px;margin:0 auto}
.dv{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "call" "main" "msg" "reply";gap:6px}
.dv>.dv-top{grid-area:top}.dv>.dv-call{grid-area:call}.dv>.dv-main{grid-area:main}.dv>.dv-lastmsg{grid-area:msg}.dv>.dv-reply{grid-area:reply}
.dv-top{display:flex;align-items:center;gap:10px;font-size:.95rem;min-height:34px}
.dv-spacer{flex:1}
.dv-ok{color:var(--good);font-weight:600}.dv-good{color:var(--good);font-weight:700}.dv-bad{color:var(--bad);font-weight:700}
.dv-ic{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r1);min-width:40px;height:36px;font-size:1.2rem;line-height:1;cursor:pointer}
.dv-main{display:grid;gap:6px;min-height:0;
  grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:2.3fr 1fr 1.15fr 1fr;
  grid-template-areas:"last last last" "pos ahead behind" "stint stint stint" "avg kart kart"}
@media (orientation:landscape){.dv-main{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));
  grid-template-areas:"last last pos ahead" "last last stint behind" "avg kart stint behind"}}
.dv-last{grid-area:last}.dv-pos{grid-area:pos}.dv-ahead{grid-area:ahead}.dv-behind{grid-area:behind}.dv-stint{grid-area:stint}.dv-avg{grid-area:avg}.dv-kart{grid-area:kart}
.dv-tile{container-type:size;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.dv-tile small{color:var(--muted);font-size:clamp(.7rem,11cqh,.95rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-tile b{font-family:var(--fd);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(1.1rem,min(46cqh,30cqi),5rem)}
.dv-tile span{font-size:clamp(.7rem,12cqh,1.05rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-tile.board{background:var(--board);color:var(--board-ink);border:0}
.dv-tile.board small{color:inherit;opacity:.8}
.dv-last b{font-size:clamp(2rem,min(50cqh,21cqi),11rem)}
.dv-last span{font-size:clamp(.8rem,11cqh,1.6rem)}
.dv-prev{color:var(--muted);font-variant-numeric:tabular-nums}
.dv-stint b{font-size:clamp(1.2rem,min(42cqh,16cqi),5rem)}
.dv-stint.warn{border-color:var(--warn)}
.dv-stint.alert{border:3px solid var(--bad)}
.dv-meter{height:clamp(5px,7cqh,12px);margin:4px 0}

<body>
<noscript>Cette application nécessite JavaScript.</noscript>
<header class="top"><div class="top-in">

<script>
/* ====================== KS : moteurs de stratégie ====================== */
const KS = (() => {
'use strict';

/* ---------- utilitaires ---------- */
const NEVER = 1e15;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => (a.length ? sum(a) / a.length : null);
function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function mad(a) { const m = median(a); return m == null ? null : median(a.map(x => Math.abs(x - m))); }
function std(a) {
  if (a.length < 2) return null;
  const m = mean(a);
  return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1));
}
function rnd(S) {
  let a = S.rng = (S.rng + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gauss(S) { let u = 0; while (!u) u = rnd(S); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd(S)); }
function poissonPmf(lam, kmax) {
  const p = []; let v = Math.exp(-lam);
  for (let k = 0; k <= kmax; k++) { p.push(v); v = v * lam / (k + 1); }
  return p;
}
function poissonSample(S, lam) {
  if (!(lam > 0)) return 0;
  if (lam > 30) return Math.max(0, Math.round(lam + Math.sqrt(lam) * gauss(S)));
  const L = Math.exp(-lam); let k = 0, p = 1;
  do { k++; p *= rnd(S); } while (p > L && k < 200);
  return k - 1;
}
function shuffle(S, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const deepClone = o => JSON.parse(JSON.stringify(o));
const r3 = x => Math.round(x * 1000) / 1000;

/* ---------- configuration ---------- */
const DEFAULT_CONFIG = {
  raceName: 'Endurance 3 h',
  durationS: 10800,
  nTeams: 8, driversPerTeam: 3, nKarts: 20, nLanes: 4, kartsPerLane: 3,
  rivalLaneMode: 'RANDOM', rivalLane: 0,
  ourTeam: 0,
  teamNames: ['Notre équipe', 'Team Médoc', 'Gironde Racing', 'Les Sous-virés', 'Apex 33', 'Team Garonne', 'Blaye Racing', 'Rapid Kart', 'Libourne Sport', 'Arcachon RT'],
  ourDrivers: ['Pilote 1', 'Pilote 2', 'Pilote 3'],
  rules: {
    qcCount: 7, qcDurationS: 90,
    refuelCount: 1, refuelDurationS: 120, refuelWindowStartS: 4800, refuelWindowEndS: 6000,
    stintMinS: 600, stintMaxS: 3600,
    kartChangeOnQC: true, driverChangeOnQC: true,
    pitLaneLossS: 10
  },
  model: { baseLap: 52.0, trackEvolution: -0.25, noise: 0.06, fatiguePerMin: 0.004, trafficProb: 0.15, trafficMax: 0.45, outlierProb: 0.012, breakdownProb: 0.0012, kartDrift: 0.002 },
  rating: { wPace: 0.35, wBest: 0.20, wCons: 0.15, wSample: 0.10, wRecency: 0.10, wCross: 0.10, paceBest: -0.6, paceWorst: 0.9 },
  outlier: { k: 4, floorS: 0.6 },
  objective: 'MAXIMIZE_POSITION',
  seed: 20261003
};

/* ---------- RulesEngine ---------- */
// ts : { stintStart, qcDone, refuelDone, inPit }
function rulesState(cfg, ts, now) {
  const R = cfg.rules, E = cfg.durationS;
  if (ts == null || ts.stintStart == null) return null;
  const qcLeft = R.qcCount - ts.qcDone, refuelLeft = R.refuelCount - ts.refuelDone;
  let qcEarliest = null, qcLatest = null;
  if (qcLeft > 0) {
    qcEarliest = Math.max(ts.stintStart + R.stintMinS, E - qcLeft * R.qcDurationS - qcLeft * R.stintMaxS);
    qcLatest = Math.min(ts.stintStart + R.stintMaxS, E - qcLeft * R.qcDurationS - qcLeft * R.stintMinS);
  }
  return {
    qcLeft, refuelLeft, stintAge: now - ts.stintStart, qcEarliest, qcLatest,
    refuelOpen: R.refuelWindowStartS, refuelClose: R.refuelWindowEndS,
    feasible: qcLeft <= 0 || qcEarliest <= qcLatest,
    finalStintTooLong: qcLeft <= 0 && ts.stintStart + R.stintMaxS < E
  };
}
// action : 'QC' | 'REFUEL' | 'STAY'
function checkAction(cfg, ts, now, action) {
  const rs = rulesState(cfg, ts, now);
  if (!rs) return { status: 'UNKNOWN', reasons: ['Données de relais manquantes'] };
  if (ts.inPit) return { status: 'ILLEGAL', reasons: ['Arrêt déjà en cours'] };
  const R = cfg.rules, reasons = [];
  if (action === 'QC') {
    if (rs.qcLeft <= 0) return { status: 'ILLEGAL', reasons: ['Nombre maximal de quick-change atteint'] };
    if (rs.stintAge < R.stintMinS) return { status: 'ILLEGAL', reasons: [`Relais trop court (min ${R.stintMinS / 60} min)`] };
    if (now < rs.qcEarliest) return { status: 'ILLEGAL', reasons: ['Les relais restants dépasseraient la durée maximale'] };
    if (rs.stintAge > R.stintMaxS || now > rs.qcLatest) return { status: 'WARNING', reasons: ['Limite dépassée : arrêt immédiat requis'] };
    if (rs.qcLatest - now < 120) reasons.push('Fenêtre de quick-change bientôt fermée');
    if (rs.refuelLeft > 0 && now >= rs.refuelOpen && rs.refuelClose - now < 240) reasons.push('Ravitaillement encore à faire, fenêtre presque fermée');
    return { status: reasons.length ? 'WARNING' : 'LEGAL', reasons };
  }
  if (action === 'REFUEL') {
    if (rs.refuelLeft <= 0) return { status: 'ILLEGAL', reasons: ['Ravitaillement déjà effectué'] };
    if (now < rs.refuelOpen) return { status: 'ILLEGAL', reasons: ['Fenêtre de ravitaillement pas encore ouverte'] };
    if (now > rs.refuelClose) return { status: 'ILLEGAL', reasons: ['Fenêtre de ravitaillement fermée'] };
    if (rs.refuelClose - now < 180) reasons.push('Fenêtre de ravitaillement presque fermée');
    if (rs.qcLeft > 0 && rs.qcLatest - now < R.refuelDurationS + 120) reasons.push('Quick-change obligatoire juste après');
    return { status: reasons.length ? 'WARNING' : 'LEGAL', reasons };
  }
  // STAY
  if (rs.stintAge > R.stintMaxS) return { status: 'ILLEGAL', reasons: ['Durée maximale de relais dépassée'] };
  if (rs.qcLeft > 0 && now > rs.qcLatest) return { status: 'ILLEGAL', reasons: ['Quick-change obligatoire en retard'] };
  if (rs.refuelLeft > 0 && now > rs.refuelClose) return { status: 'ILLEGAL', reasons: ['Ravitaillement manqué'] };
  if (rs.qcLeft > 0 && rs.qcLatest - now < 120) reasons.push('Quick-change à faire très vite');
  if (rs.refuelLeft > 0 && now >= rs.refuelOpen && rs.refuelClose - now < 240) reasons.push('Ravitaillement à faire très vite');
  return { status: reasons.length ? 'WARNING' : 'LEGAL', reasons };
}
// conformité a posteriori d'une équipe (relais et arrêts)
function complianceFor(cfg, tm, T, finished) {
  const R = cfg.rules, out = [];
  tm.stints.forEach((s, i) => {
    const end = s.end != null ? s.end : (finished ? Math.min(T, cfg.durationS) : null);
    if (end == null) { if (T - s.start > R.stintMaxS) out.push({ code: 'STINT_TOO_LONG', msg: `Relais ${i + 1} au-delà de ${R.stintMaxS / 60} min` }); return; }
    const d = end - s.start;
    if (d < R.stintMinS - 1) out.push({ code: 'STINT_TOO_SHORT', msg: `Relais ${i + 1} : ${Math.round(d / 60)} min (< ${R.stintMinS / 60})` });
    if (d > R.stintMaxS + 1) out.push({ code: 'STINT_TOO_LONG', msg: `Relais ${i + 1} : ${Math.round(d / 60)} min (> ${R.stintMaxS / 60})` });
  });
  tm.pits.forEach(p => {
    const nominal = p.type === 'QC' ? R.qcDurationS : R.refuelDurationS;
    if (p.dur != null && p.dur < nominal - 0.5) out.push({ code: 'PIT_TOO_SHORT', msg: `Arrêt de ${p.dur.toFixed(1)} s (< ${nominal})` });
    if (p.type === 'REFUEL' && (p.start < R.refuelWindowStartS || p.start > R.refuelWindowEndS)) out.push({ code: 'REFUEL_OUT_OF_WINDOW', msg: 'Ravitaillement hors fenêtre' });
  });
  if (tm.refuelDone < R.refuelCount && T > R.refuelWindowEndS) out.push({ code: 'REFUEL_MISSED', msg: 'Ravitaillement non effectué dans la fenêtre' });
  if (finished && tm.qcDone !== R.qcCount) out.push({ code: 'QC_COUNT', msg: `${tm.qcDone} quick-change sur ${R.qcCount}` });
  if (tm.qcDone > R.qcCount) out.push({ code: 'QC_EXCESS', msg: 'Trop de quick-change' });
  return out;
}

/* ---------- MockTimingProvider : simulateur de course ---------- */
function createRace(cfgIn) {
  const cfg = deepClone(cfgIn);
  const S = { rng: (cfg.seed >>> 0) || 1 };
  const nT = cfg.nTeams, nD = cfg.driversPerTeam;
  if (cfg.kartsPerLane > 0) cfg.nKarts = nT + cfg.nLanes * cfg.kartsPerLane;
  const nK = Math.max(cfg.nKarts, nT + cfg.nLanes);
  const karts = [];
  for (let k = 0; k < nK; k++) {
    const r = rnd(S); let eff;
    if (r < 0.25) eff = -0.6 + rnd(S) * 0.3; else if (r < 0.75) eff = -0.2 + rnd(S) * 0.5; else eff = 0.3 + rnd(S) * 0.8;
    karts.push({ effect: eff, broken: false });
  }
  const order = shuffle(S, [...Array(nK).keys()]);
  const startKarts = order.slice(0, nT), pool = order.slice(nT);
  const lanes = Array.from({ length: cfg.nLanes }, () => []);
  pool.forEach((k, i) => lanes[i % cfg.nLanes].push(k));
  const drivers = [], teams = [];
  for (let i = 0; i < nT; i++) {
    const name = cfg.teamNames[i] || `Équipe ${i + 1}`;
    const short = name.replace(/^(Team|Les|Notre)\s+/i, '').split(/\s+/)[0];
    const lvl = 0.12 + gauss(S) * 0.18, ids = [];
    for (let j = 0; j < nD; j++) {
      const id = drivers.length;
      drivers.push({ id, name: i === cfg.ourTeam ? (cfg.ourDrivers[j] || `Pilote ${j + 1}`) : `${short} ${j + 1}`, team: i, perf: clamp(lvl + gauss(S) * 0.15, -0.4, 0.9) });
      ids.push(id);
    }
    teams.push({ id: i, name, drivers: ids });
  }
  const setup = {
    teams, drivers: drivers.map(d => ({ id: d.id, name: d.name, team: d.team })),
    karts: karts.map((k, i) => ({ id: i, num: i + 1 })),
    startKarts, startDrivers: teams.map(t => t.drivers[0]), initialLanes: deepClone(lanes)
  };
  const sim = {
    rng: S.rng, t: 0, status: 'READY', karts, drivers: drivers.map(d => ({ perf: d.perf })), lanes, repairs: [],
    teams: teams.map((t, i) => ({
      kart: startKarts[i], driver: t.drivers[0], drivers: t.drivers, lapsDone: 0, lastCross: 0, nextCross: NEVER,
      curLapTime: 0, curLapFlag: null, stintStart: 0, stintTarget: null, qcDone: 0, refuelDone: 0, inPit: null,
      pitDoneAt: NEVER, request: null, refuelPlanT: null, finished: false, driveTime: {}, brokenLaps: 0
    }))
  };
  return { version: 1, cfg, setup, sim, events: [], buffer: [], link: 'LIVE', autopilot: true, audit: [], manualRatings: {}, seq: 0 };
}

function emit(race, ev, direct) {
  ev.id = ++race.seq;
  if (!direct && race.link !== 'LIVE') race.buffer.push(ev); else race.events.push(ev);
  return ev;
}
function setLink(race, link) {
  const t = race.sim.t;
  if (link === race.link) return;
  if (link !== 'LIVE' && race.link === 'LIVE') emit(race, { type: 'DATA_DISCONNECTED', t }, true);
  race.link = link;
  if (link === 'LIVE') {
    race.events.push(...race.buffer); race.buffer = [];
    race.events.sort((a, b) => a.t - b.t || a.id - b.id);
    emit(race, { type: 'DATA_CONNECTED', t }, true);
  }
}

function lapTimeFor(race, tm, t) {
  const { cfg, sim } = race, M = cfg.model;
  const k = sim.karts[tm.kart], d = sim.drivers[tm.driver];
  let lt = M.baseLap + d.perf + k.effect + M.trackEvolution * (t / cfg.durationS) +
    M.fatiguePerMin * Math.max(0, (t - tm.stintStart) / 60) + M.noise * gauss(sim);
  if (rnd(sim) < M.trafficProb) lt += rnd(sim) * M.trafficMax;
  if (rnd(sim) < M.outlierProb) lt += 2.5 + rnd(sim) * 6;
  if (k.broken) lt += 2 + rnd(sim) * 2.5;
  k.effect += M.kartDrift * gauss(sim);
  return lt;
}
function stintTargetFor(race, tm, t) {
  const R = race.cfg.rules, qcLeft = R.qcCount - tm.qcDone;
  if (qcLeft <= 0) return null;
  const avg = (race.cfg.durationS - t - qcLeft * R.qcDurationS) / (qcLeft + 1);
  return clamp(avg * (1 + 0.12 * gauss(race.sim)), R.stintMinS + 45, R.stintMaxS - 150);
}

function startRace(race) {
  const { sim, cfg } = race;
  if (sim.status !== 'READY') return false;
  sim.status = 'RUNNING';
  emit(race, { type: 'RACE_STARTED', t: 0 });
  const R = cfg.rules;
  sim.teams.forEach((tm, i) => {
    tm.curLapFlag = 'START';
    tm.curLapTime = lapTimeFor(race, tm, 0) + 2 + i * 0.25;
    tm.nextCross = tm.curLapTime;
    tm.stintTarget = stintTargetFor(race, tm, 0);
    tm.refuelPlanT = R.refuelWindowStartS + 60 + rnd(sim) * Math.max(0, R.refuelWindowEndS - R.refuelWindowStartS - 300);
  });
  return true;
}
function pauseRace(race) { if (race.sim.status === 'RUNNING') { race.sim.status = 'PAUSED'; emit(race, { type: 'RACE_PAUSED', t: race.sim.t }); } }
function resumeRace(race) { if (race.sim.status === 'PAUSED') { race.sim.status = 'RUNNING'; emit(race, { type: 'RACE_RESUMED', t: race.sim.t }); } }

function requestPit(race, type, lane) {
  const tm = race.sim.teams[race.cfg.ourTeam];
  if (tm.finished) return false;
  tm.request = { type, lane: lane == null ? null : lane };
  return true;
}
function cancelPit(race) { race.sim.teams[race.cfg.ourTeam].request = null; }

function setLanes(race, lanes) {
  const cur = race.sim.lanes.flat().sort((a, b) => a - b).join(',');
  const nxt = lanes.flat().sort((a, b) => a - b).join(',');
  if (cur !== nxt || lanes.length !== race.sim.lanes.length) return false;
  race.sim.lanes = deepClone(lanes);
  emit(race, { type: 'LANES_SET', t: race.sim.t, lanes: deepClone(lanes) }, true);
  return true;
}

function nonEmptyLanes(sim) { return sim.lanes.map((l, i) => (l.length ? i : -1)).filter(i => i >= 0); }

function aiDecide(race, i, t, hooks) {
  const { cfg, sim } = race, R = cfg.rules, tm = sim.teams[i];
  const rs = rulesState(cfg, tm, t), lap = cfg.model.baseLap + 0.6;
  const broken = sim.karts[tm.kart].broken && tm.brokenLaps >= 1;
  const qcOk = rs.qcLeft > 0 && t >= rs.qcEarliest;
  const refuelOpen = rs.refuelLeft > 0 && t >= R.refuelWindowStartS && t <= R.refuelWindowEndS;
  const qcUrgent = qcOk && t + 1.5 * lap > rs.qcLatest - (refuelOpen ? 0 : 0);
  const refuelUrgent = refuelOpen && t + 2 * lap > R.refuelWindowEndS;
  const pickLane = () => chooseLaneAI(race, hooks);
  if (qcUrgent && (!refuelUrgent || rs.qcLatest <= R.refuelWindowEndS)) return { type: 'QC', lane: pickLane() };
  if (refuelOpen && (t >= tm.refuelPlanT || refuelUrgent)) {
    if (!(rs.qcLeft > 0 && rs.qcLatest - t < R.refuelDurationS + 2 * lap)) return { type: 'REFUEL' };
  }
  if (qcOk && (broken || t - tm.stintStart >= tm.stintTarget)) return { type: 'QC', lane: pickLane() };
  return null;
}
function chooseLaneAI(race, hooks) {
  const sim = race.sim, ne = nonEmptyLanes(sim), cfg = race.cfg;
  if (!ne.length) return null;
  if (cfg.rivalLaneMode === 'SAME') { const L = clamp(cfg.rivalLane | 0, 0, sim.lanes.length - 1); if (sim.lanes[L].length) return L; }
  return ne[Math.floor(rnd(sim) * ne.length)];
}

function onCross(race, i, hooks) {
  const { cfg, sim } = race, R = cfg.rules, tm = sim.teams[i], t = sim.t;
  tm.lapsDone++; tm.lastCross = t;
  tm.driveTime[tm.driver] = (tm.driveTime[tm.driver] || 0) + tm.curLapTime;
  emit(race, { type: 'LAP_COMPLETED', t, team: i, lap: tm.lapsDone, time: r3(tm.curLapTime), driver: tm.driver, kart: tm.kart, flag: tm.curLapFlag });
  if (t >= cfg.durationS) { tm.finished = true; tm.nextCross = NEVER; emit(race, { type: 'TEAM_FINISHED', t, team: i }); return; }
  const k = sim.karts[tm.kart];
  if (k.broken) tm.brokenLaps++;
  else if (rnd(sim) < cfg.model.breakdownProb) { k.broken = true; tm.brokenLaps = 0; }
  let stop = null;
  if (i === cfg.ourTeam) {
    if (tm.request) stop = tm.request;
    else if (race.autopilot && hooks && hooks.ourDecide) stop = hooks.ourDecide(t);
  } else stop = aiDecide(race, i, t, hooks);
  if (stop) {
    const rs = rulesState(cfg, tm, t);
    if (stop.type === 'QC' && rs.qcLeft <= 0) stop = null;
    else if (stop.type === 'REFUEL' && rs.refuelLeft <= 0) stop = null;
  }
  tm.request = null;
  if (stop) {
    const nominal = stop.type === 'QC' ? R.qcDurationS : R.refuelDurationS;
    const dur = nominal + 0.5 + rnd(sim) * 3;
    let lane = stop.lane;
    if (stop.type === 'QC' && R.kartChangeOnQC && (lane == null || !sim.lanes[lane] || !sim.lanes[lane].length)) lane = chooseLaneAI(race, hooks);
    tm.inPit = { type: stop.type, since: t, lane: stop.type === 'QC' ? lane : null, dur };
    tm.pitDoneAt = t + dur; tm.nextCross = NEVER;
    if (stop.type === 'QC') tm.qcDone++; else tm.refuelDone++;
    emit(race, { type: 'PIT_STARTED', t, team: i, stop: stop.type, lane: tm.inPit.lane });
    return;
  }
  tm.curLapFlag = null;
  tm.curLapTime = lapTimeFor(race, tm, t);
  tm.nextCross = t + tm.curLapTime;
}

function onPitDone(race, i, hooks) {
  const { cfg, sim } = race, R = cfg.rules, tm = sim.teams[i], t = sim.t, p = tm.inPit;
  tm.pitDoneAt = NEVER;
  const ev = { type: 'PIT_COMPLETED', t, team: i, stop: p.type, dur: r3(t - p.since) };
  if (p.type === 'QC') {
    const driverOut = tm.driver;
    let driverIn = driverOut;
    if (R.driverChangeOnQC && tm.drivers.length > 1) {
      const cands = tm.drivers.filter(d => d !== driverOut);
      cands.sort((a, b) => (tm.driveTime[a] || 0) - (tm.driveTime[b] || 0));
      driverIn = cands[0];
    }
    const kartOut = tm.kart; let kartIn = kartOut, lane = p.lane, to = null;
    if (R.kartChangeOnQC && lane != null && sim.lanes[lane] && sim.lanes[lane].length) {
      kartIn = sim.lanes[lane].shift();
      if (sim.karts[kartOut].broken) { to = 'MAINT'; sim.repairs.push({ kart: kartOut, t: t + 900 + rnd(sim) * 600 }); }
      else { to = 'LANE'; sim.lanes[lane].push(kartOut); }
    } else if (sim.karts[kartOut].broken) {
      sim.karts[kartOut].broken = false; // réparé sur place faute de kart disponible
    }
    tm.kart = kartIn; tm.driver = driverIn; tm.stintStart = t; tm.brokenLaps = 0;
    tm.stintTarget = stintTargetFor(race, tm, t);
    Object.assign(ev, { lane, kartOut, kartIn, kartOutTo: to, driverOut, driverIn });
    emit(race, ev);
    if (driverIn !== driverOut) emit(race, { type: 'DRIVER_CHANGED', t, team: i, from: driverOut, to: driverIn });
    if (kartIn !== kartOut) emit(race, { type: 'KART_CHANGED', t, team: i, from: kartOut, to: kartIn, lane });
    if (to === 'MAINT') emit(race, { type: 'KART_BROKEN', t, team: i, kart: kartOut });
  } else emit(race, ev);
  tm.inPit = null;
  tm.curLapFlag = 'PIT';
  const rest = lapTimeFor(race, tm, t);
  tm.curLapTime = (t - p.since) + R.pitLaneLossS + rest;
  tm.nextCross = p.since + tm.curLapTime;
}

function onRepair(race, idx) {
  const sim = race.sim, rp = sim.repairs[idx];
  sim.repairs.splice(idx, 1);
  sim.karts[rp.kart].broken = false;
  let lane = 0; sim.lanes.forEach((l, i) => { if (l.length < sim.lanes[lane].length) lane = i; });
  sim.lanes[lane].push(rp.kart);
  emit(race, { type: 'KART_AVAILABLE', t: sim.t, kart: rp.kart, lane });
}

function simAdvance(race, toT, hooks) {
  const sim = race.sim;
  if (sim.status !== 'RUNNING') return;
  let guard = 0;
  while (guard++ < 100000) {
    let best = NEVER, kind = null, idx = -1;
    sim.teams.forEach((tm, i) => {
      if (tm.finished) return;
      if (tm.pitDoneAt < best) { best = tm.pitDoneAt; kind = 'pit'; idx = i; }
      if (tm.nextCross < best) { best = tm.nextCross; kind = 'cross'; idx = i; }
    });
    sim.repairs.forEach((r, i) => { if (r.t < best) { best = r.t; kind = 'repair'; idx = i; } });
    if (kind == null || best > toT) break;
    sim.t = best;
    if (kind === 'cross') onCross(race, idx, hooks);
    else if (kind === 'pit') onPitDone(race, idx, hooks);
    else onRepair(race, idx);
  }
  if (sim.teams.every(tm => tm.finished)) {
    sim.status = 'FINISHED';
    emit(race, { type: 'RACE_FINISHED', t: sim.t });
    return;
  }
  sim.t = Math.max(sim.t, toT);
}

/* ---------- état de course dérivé des événements (live et replay) ---------- */
function stars(r) { if (r == null) return 0; return r >= 88 ? 5 : r >= 72 ? 4 : r >= 55 ? 3 : r >= 38 ? 2 : 1; }

function buildState(race, T) {
  const { cfg, setup } = race;
  const teams = setup.teams.map((st, i) => ({
    id: i, name: st.name, drivers: st.drivers, laps: [], cross: [0], lapsDone: 0, lastCross: 0,
    stintStart: 0, qcDone: 0, refuelDone: 0, inPit: null, pitLapStart: null, pitLapStopEnd: null,
    kart: setup.startKarts[i], driver: setup.startDrivers[i],
    stints: [{ driver: setup.startDrivers[i], kart: setup.startKarts[i], start: 0, end: null }],
    pits: [], finished: false, finishT: null
  }));
  let lanes = setup.initialLanes.map(l => [...l]);
  const maint = new Set(), takes = [], timeline = [], kartTakes = {};
  let status = 'READY', lastDataT = 0, link = 'LIVE';
  const removeFromLanes = k => lanes.forEach(l => { const j = l.indexOf(k); if (j >= 0) l.splice(j, 1); });
  for (const ev of race.events) {
    if (ev.t > T) break;
    const tm = ev.team != null ? teams[ev.team] : null;
    switch (ev.type) {
      case 'RACE_STARTED': status = 'RUNNING'; timeline.push(ev); break;
      case 'RACE_PAUSED': status = 'PAUSED'; timeline.push(ev); break;
      case 'RACE_RESUMED': status = 'RUNNING'; timeline.push(ev); break;
      case 'RACE_FINISHED': status = 'FINISHED'; timeline.push(ev); break;
      case 'DATA_DISCONNECTED': link = 'OFFLINE'; timeline.push(ev); break;
      case 'DATA_CONNECTED': link = 'LIVE'; timeline.push(ev); break;
      case 'LAP_COMPLETED': {
        tm.laps.push({ team: ev.team, n: ev.lap, time: ev.time, t: ev.t, driver: ev.driver, kart: ev.kart, flag: ev.flag, valid: true, reason: null });
        tm.cross[ev.lap] = ev.t; tm.lapsDone = ev.lap; tm.lastCross = ev.t; lastDataT = ev.t;
        break;
      }
      case 'PIT_STARTED':
        tm.inPit = { type: ev.stop, since: ev.t, lane: ev.lane };
        tm.pitLapStart = ev.t; tm.pitLapStopEnd = null;
        if (ev.stop === 'QC') { tm.qcDone++; tm.stints[tm.stints.length - 1].end = ev.t; } else tm.refuelDone++;
        timeline.push(ev); break;
      case 'PIT_COMPLETED': {
        const p = { type: ev.stop, start: ev.t - ev.dur, end: ev.t, dur: ev.dur, lane: ev.lane, kartOut: ev.kartOut, kartIn: ev.kartIn, driverOut: ev.driverOut, driverIn: ev.driverIn };
        tm.pits.push(p);
        if (ev.stop === 'QC') {
          if (ev.kartIn != null && ev.kartIn !== ev.kartOut) {
            removeFromLanes(ev.kartIn);
            if (ev.kartOut != null) { if (ev.kartOutTo === 'LANE' && lanes[ev.lane]) lanes[ev.lane].push(ev.kartOut); else if (ev.kartOutTo === 'MAINT') maint.add(ev.kartOut); }
            takes.push({ lane: ev.lane, t: ev.t, team: ev.team });
            kartTakes[ev.kartIn] = (kartTakes[ev.kartIn] || 0) + 1;
          }
          if (ev.kartIn == null && ev.kartOut != null && ev.kartOutTo === 'LANE' && lanes[ev.lane]) lanes[ev.lane].push(ev.kartOut);
          tm.kart = ev.kartIn; tm.driver = ev.driverIn; tm.stintStart = ev.t;
          tm.stints.push({ driver: ev.driverIn, kart: ev.kartIn, start: ev.t, end: null });
        }
        tm.pitLapStopEnd = ev.t; tm.inPit = null;
        timeline.push(ev); break;
      }
      case 'PIT_RECLASSIFIED':
        if (ev.to === 'REFUEL' && tm.inPit && tm.inPit.type === 'QC') { tm.qcDone--; tm.refuelDone++; tm.inPit.type = 'REFUEL'; tm.stints[tm.stints.length - 1].end = null; }
        else if (ev.to === 'QC' && tm.inPit && tm.inPit.type === 'REFUEL') { tm.refuelDone--; tm.qcDone++; tm.inPit.type = 'QC'; tm.stints[tm.stints.length - 1].end = ev.since != null ? ev.since : tm.inPit.since; }
        break;
      case 'KART_ASSIGNED': {
        const p = [...tm.pits].reverse().find(x => x.type === 'QC' && x.kartIn == null);
        removeFromLanes(ev.kart);
        if (p) {
          if (p.kartOut != null && ev.lane != null && lanes[ev.lane] && !lanes.some(l => l.includes(p.kartOut))) lanes[ev.lane].push(p.kartOut);
          p.kartIn = ev.kart; p.lane = ev.lane;
          if (ev.lane != null) takes.push({ lane: ev.lane, t: p.end, team: ev.team });
          kartTakes[ev.kart] = (kartTakes[ev.kart] || 0) + 1;
          tm.laps.forEach(l => { if (l.kart == null && l.t >= p.end) l.kart = ev.kart; });
          const s = tm.stints.find(x => x.start >= p.end - 1 && x.kart == null); if (s) s.kart = ev.kart;
        }
        if (tm.kart == null) tm.kart = ev.kart;
        timeline.push(ev); break;
      }
      case 'KART_SET': {
        removeFromLanes(ev.kart); maint.delete(ev.kart);
        const s = tm.stints[tm.stints.length - 1];
        tm.laps.forEach(l => { if (l.kart == null && l.t >= s.start) l.kart = ev.kart; });
        if (s.kart == null) s.kart = ev.kart;
        tm.kart = ev.kart; timeline.push(ev); break;
      }
      case 'KART_AVAILABLE': maint.delete(ev.kart); removeFromLanes(ev.kart); if (lanes[ev.lane]) lanes[ev.lane].push(ev.kart); timeline.push(ev); break;
      case 'KART_BROKEN': timeline.push(ev); break;
      case 'LANES_SET': lanes = ev.lanes.map(l => [...l]); timeline.push(ev); break;
      case 'TEAM_FINISHED': tm.finished = true; tm.finishT = ev.t; break;
      default: break;
    }
  }
  // détection des tours atypiques (médiane + MAD), données brutes conservées
  const M = cfg.model, O = cfg.outlier;
  teams.forEach(tm => {
    let win = [], key = null, streak = [];
    tm.laps.forEach(lap => {
      if (lap.flag === 'START' || lap.flag === 'GAP') { lap.valid = false; lap.reason = lap.flag; return; }
      if (lap.flag === 'PIT') { lap.valid = false; lap.reason = 'PIT'; win = []; streak = []; key = null; return; }
      const k = (lap.kart == null ? 'x' + lap.team : lap.kart) + '/' + lap.driver;
      if (k !== key) { win = []; streak = []; key = k; }
      if (win.length >= 4) {
        const m = median(win), d = mad(win), thr = Math.max(O.k * 1.4826 * d, O.floorS);
        if (Math.abs(lap.time - m) > thr) { lap.valid = false; lap.reason = 'OUTLIER'; }
      } else if (lap.time > M.baseLap * 1.1) { lap.valid = false; lap.reason = 'OUTLIER'; }
      if (!lap.valid) {
        streak.push(lap);
        const ts = streak.map(l => l.time);
        if (streak.length >= 3 && Math.max(...ts) - Math.min(...ts) < 1.5) {
          // changement de régime durable (kart dégradé) : ce n'est plus atypique
          streak.forEach(l => { l.valid = true; l.reason = null; });
          win = [...ts]; streak = [];
        }
      } else { streak = []; win.push(lap.time); if (win.length > 15) win.shift(); }
    });
  });
  return { T, status, teams, lanes, maint, takes, timeline, lastDataT, link, kartTakes };
}

function paceStats(valid) {
  const n = valid.length, last = k => (n >= k ? mean(valid.slice(-k)) : null);
  const s10 = std(valid.slice(-10));
  const st = {
    n, lastLap: n ? valid[n - 1] : null, bestLap: n ? Math.min(...valid) : null,
    average3: last(3), average5: last(5), average10: last(10), average15: last(15),
    median5: n >= 5 ? median(valid.slice(-5)) : null, median10: n >= 10 ? median(valid.slice(-10)) : null,
    standardDeviation: s10, consistency: s10 == null ? null : clamp(100 * (1 - (s10 - 0.05) / 0.6), 0, 100)
  };
  const parts = [[st.average5, 0.5], [st.average10, 0.3], [st.average15, 0.2]].filter(p => p[0] != null);
  st.projected = parts.length ? sum(parts.map(p => p[0] * p[1])) / sum(parts.map(p => p[1])) : (n ? mean(valid) : null);
  return st;
}

/* ---------- KartRatingEngine (+ normalisation pilote / kart) ---------- */
function rateKarts(race, state) {
  const { cfg, setup } = race, W = cfg.rating, T = state.T;
  const nK = setup.karts.length, nD = setup.drivers.length;
  const all = [], counts = new Array(nK).fill(0);
  state.teams.forEach(tm => tm.laps.forEach(l => { if (l.kart == null || counts[l.kart] == null) return; counts[l.kart]++; if (l.valid) all.push(l); }));
  const res = setup.karts.map(k => ({ id: k.id, num: k.num, n: 0, total: counts[k.id], drivers: 0, teams: 0, k: 0, se: 0.4, sd: null, bestAdj: null, lastSeen: null, rating: null, confidence: 0, scores: null, manual: race.manualRatings[k.id] || 0 }));
  const drv = setup.drivers.map(d => ({ id: d.id, name: d.name, team: d.team, d: 0, n: 0 }));
  if (all.length < 3) return { karts: res, drivers: drv, mu: null };
  let mu = median(all.map(l => l.time));
  const kE = new Float64Array(nK), dE = new Float64Array(nD), bE = {};
  const bin = l => Math.floor(l.t / 900);
  for (let it = 0; it < 8; it++) {
    const bs = {}, bn = {};
    all.forEach(l => { const b = bin(l), r = l.time - mu - kE[l.kart] - dE[l.driver]; bs[b] = (bs[b] || 0) + r; bn[b] = (bn[b] || 0) + 1; });
    for (const b in bs) bE[b] = bs[b] / (bn[b] + 5);
    const ds = new Float64Array(nD), dn = new Float64Array(nD);
    all.forEach(l => { ds[l.driver] += l.time - mu - kE[l.kart] - (bE[bin(l)] || 0); dn[l.driver]++; });
    for (let i = 0; i < nD; i++) dE[i] = ds[i] / (dn[i] + 2);
    const ks = new Float64Array(nK), kn = new Float64Array(nK);
    all.forEach(l => { ks[l.kart] += l.time - mu - dE[l.driver] - (bE[bin(l)] || 0); kn[l.kart]++; });
    for (let j = 0; j < nK; j++) kE[j] = ks[j] / (kn[j] + 3);
    const used = [...Array(nK).keys()].filter(j => kn[j] > 0);
    const km = mean(used.map(j => kE[j])) || 0;
    used.forEach(j => { kE[j] -= km; }); mu += km;
    const dUsed = [...Array(nD).keys()].filter(i => dn[i] > 0);
    const dm = mean(dUsed.map(i => dE[i])) || 0;
    dUsed.forEach(i => { dE[i] -= dm; }); mu += dm;
  }
  const per = setup.karts.map(() => ({ res: [], adj: [], drivers: new Set(), teams: new Set(), last: null }));
  all.forEach(l => {
    const b = bE[bin(l)] || 0, p = per[l.kart];
    p.res.push(l.time - mu - dE[l.driver] - kE[l.kart] - b);
    p.adj.push(l.time - dE[l.driver] - b - mu);
    p.drivers.add(l.driver); p.teams.add(l.team); p.last = Math.max(p.last || 0, l.t);
  });
  const bests = [];
  res.forEach((r, j) => {
    const p = per[j]; r.n = p.res.length;
    if (!r.n) return;
    r.k = kE[j]; r.drivers = p.drivers.size; r.teams = p.teams.size; r.lastSeen = p.last;
    r.sd = Math.max(0.05, 1.4826 * (mad(p.res) || 0.05));
    r.se = Math.sqrt((r.sd / Math.sqrt(r.n)) ** 2 + 0.35 ** 2 * (3 / (r.n + 3)) ** 2);
    r.bestAdj = Math.min(...p.adj);
    if (r.n >= 3) bests.push(r.bestAdj);
  });
  const bMin = bests.length ? Math.min(...bests) : 0, bMax = bests.length ? Math.max(...bests) : 0;
  const wsum = W.wPace + W.wBest + W.wCons + W.wSample + W.wRecency + W.wCross || 1;
  res.forEach(r => {
    if (!r.n) return;
    const age = T - r.lastSeen;
    const sc = {
      pace: clamp(100 * (W.paceWorst - r.k) / (W.paceWorst - W.paceBest), 0, 100),
      best: bests.length >= 2 && bMax > bMin ? clamp(100 * (bMax - r.bestAdj) / (bMax - bMin), 0, 100) : 50,
      consistency: clamp(100 * (0.6 - r.sd) / 0.52, 0, 100),
      sample: clamp(100 * r.n / 30, 0, 100),
      recency: age < 600 ? 100 : clamp(100 - (age - 600) / 60, 30, 100),
      cross: [0, 40, 75, 100][Math.min(r.drivers, 3)]
    };
    r.scores = sc;
    // performance (rythme, meilleur tour, régularité) ramenée vers 50 si l'échantillon est faible, ancien ou mono-pilote
    const wp = (W.wPace + W.wBest + W.wCons) || 1, wq = (W.wSample + W.wRecency + W.wCross) || 1;
    const perf = (W.wPace * sc.pace + W.wBest * sc.best + W.wCons * sc.consistency) / wp;
    const qual = (W.wSample * sc.sample + W.wRecency * sc.recency + W.wCross * sc.cross) / wq / 100;
    const qw = clamp(wq / wsum, 0, 1);
    const raw = 50 + (perf - 50) * (1 - qw * 1.5 * (1 - qual));
    r.rating = Math.round(clamp(raw + r.manual, 0, 100));
    const sampleC = 1 - Math.exp(-r.n / 10), cov = [0, 0.6, 0.85, 1][Math.min(r.drivers, 3)];
    const rec = clamp(1 - Math.max(0, age - 900) / 7200, 0.5, 1), stab = 1 / Math.sqrt(1 + (r.se / 0.12) ** 2);
    const quality = clamp(0.7 + 0.3 * (r.n / Math.max(1, r.total)), 0.7, 1);
    r.confidence = Math.round(100 * sampleC * cov * rec * stab * quality);
    if (r.manual) r.confidence = Math.round(r.confidence * 0.9);
  });
  drv.forEach(d => { d.d = dE[d.id]; });
  all.forEach(l => { drv[l.driver].n++; });
  return { karts: res, drivers: drv, mu };
}

/* ---------- classement, position nette, projection ---------- */
function gapLapMatched(a, b) { const n = Math.min(a.lapsDone, b.lapsDone); return n < 1 ? null : b.cross[n] - a.cross[n]; }

function computeStandings(race, st) {
  const { cfg } = race, R = cfg.rules, E = cfg.durationS, T = st.T;
  st.teams.forEach(tm => {
    tm.valid = tm.laps.filter(l => l.valid).map(l => l.time);
    tm.stats = paceStats(tm.valid);
  });
  const projs = st.teams.map(t => t.stats.projected).filter(x => x != null);
  st.refLap = median(projs) || cfg.model.baseLap;
  st.teams.forEach(tm => {
    const proj = tm.stats.projected != null ? tm.stats.projected : st.refLap;
    tm.proj = proj;
    let frac = 0;
    if (st.status === 'READY' || tm.finished) frac = 0;
    else if (tm.inPit) frac = 0;
    else if (tm.pitLapStart != null && tm.pitLapStart === tm.lastCross && tm.pitLapStopEnd != null) frac = (T - tm.pitLapStopEnd) / (proj + R.pitLaneLossS);
    else frac = (T - tm.lastCross) / proj;
    tm.prog = tm.lapsDone + clamp(frac, 0, 0.98);
    tm.qcLeft = Math.max(0, R.qcCount - tm.qcDone); tm.refuelLeft = Math.max(0, R.refuelCount - tm.refuelDone);
    let loss = tm.qcLeft * (R.qcDurationS + R.pitLaneLossS) + tm.refuelLeft * (R.refuelDurationS + R.pitLaneLossS);
    if (tm.inPit) loss += Math.max(0, tm.inPit.since + (tm.inPit.type === 'QC' ? R.qcDurationS : R.refuelDurationS) - T) + R.pitLaneLossS;
    tm.remainingLoss = loss;
    tm.rules = rulesState(cfg, tm, T);
  });
  const order = [...st.teams].sort((a, b) => b.lapsDone - a.lapsDone || (a.lapsDone ? a.lastCross - b.lastCross : a.id - b.id));
  order.forEach((tm, i) => { tm.position = i + 1; });
  const leader = order[0];
  order.forEach((tm, i) => {
    tm.gapLeader = tm === leader ? 0 : gapLapMatched(leader, tm);
    tm.lapsBehind = leader.lapsDone - tm.lapsDone;
    tm.interval = i === 0 ? null : gapLapMatched(order[i - 1], tm);
  });
  const net = [...st.teams].sort((a, b) => ((b.prog * st.refLap - b.remainingLoss) - (a.prog * st.refLap - a.remainingLoss)) || (a.position - b.position));
  net.forEach((tm, i) => { tm.netPosition = i + 1; });
  const remain = Math.max(0, E - T);
  st.teams.forEach(tm => { tm.finalDist = tm.finished ? tm.prog : tm.prog + Math.max(0, remain - tm.remainingLoss) / tm.proj; });
  const proj = [...st.teams].sort((a, b) => (b.finalDist - a.finalDist) || (a.position - b.position));
  proj.forEach((tm, i) => { tm.projectedPosition = i + 1; });
  const stale = st.status === 'RUNNING' ? Math.max(0, T - st.lastDataT) : 0;
  st.dataQuality = clamp(1 - Math.max(0, stale - 2 * st.refLap) / 300, 0.3, 1);
  st.teams.forEach(tm => {
    const sample = Math.min(1, tm.valid.length / 15), spread = tm.stats.standardDeviation == null ? 0.5 : clamp(1 - tm.stats.standardDeviation / 1.2, 0.4, 1);
    tm.projConfidence = Math.round(100 * Math.sqrt(sample) * spread * (1 - 0.45 * remain / E) * st.dataQuality);
  });
  st.order = order; st.netOrder = net; st.projOrder = proj;
}

/* ---------- RivalAnalysisEngine ---------- */
function analyzeRivals(race, st, ratingById) {
  const our = st.teams[race.cfg.ourTeam], L = st.refLap, laneLoss = race.cfg.rules.pitLaneLossS;
  return st.teams.filter(t => t !== our).map(r => {
    const gap = (r.prog - our.prog) * L;
    const netGap = gap - (r.remainingLoss - our.remainingLoss);
    const paceDelta = (our.stats.projected != null && r.stats.projected != null) ? our.stats.projected - r.stats.projected : null;
    let gapTrend = null;
    const n = Math.min(r.lapsDone, our.lapsDone);
    if (n >= 7) {
      const span = [r, our].every(tm => tm.laps.slice(Math.max(0, n - 6), n).every(l => !l.flag));
      if (span) gapTrend = ((our.cross[n] - r.cross[n]) - (our.cross[n - 5] - r.cross[n - 5])) / 5;
    }
    let catchLaps = null, catchBy = null;
    if (paceDelta != null) {
      if (netGap > 0 && paceDelta < -0.02) { catchLaps = netGap / -paceDelta; catchBy = 'US'; }
      else if (netGap < 0 && paceDelta > 0.02) { catchLaps = -netGap / paceDelta; catchBy = 'THEM'; }

    const lapsLeft = Math.max(0, (race.cfg.durationS - st.T) / L);

    const data = { pitLoss: b.pitLoss, nextKart: b.likelyKart != null ? A.kartNum(b.likelyKart) : null, nextKartRating: b.likelyKart != null && A.ratingById[b.likelyKart] ? A.ratingById[b.likelyKart].rating : null,
      nextKartConfidence: b.likelyKart != null ? ratingConfOf(A, b.likelyKart) : 0, estimatedAvailability: Math.round(b.delta), kartGainPerLap: r3(b.kartGain), expectedStrategicValue: r3(b.expectedStrategicValue) };
    const conf = 100 * dq * (0.45 + 0.55 * (data.nextKartConfidence / 100)) * (0.6 + 0.4 * (sd.currentKartConfidence / 100));
    const margin = now ? b.expectedStrategicValue - Math.max(...pw.candidates.filter(c => c.delta > 0).map(c => c.expectedStrategicValue), -1e9) : 0;
    if (b.delta === 0 && now && qcChk.status !== 'ILLEGAL' && b.kartGain <= 0.08 && b.balanceDue) {
      return mk('PIT', conf * 0.9, 'Relais long : équilibrer le temps de volant', `Kart suivant ${data.nextKart ? '#' + data.nextKart : '—'} (${b.kartGain >= 0 ? '+' : ''}${b.kartGain.toFixed(2)} s/tour estimé)`, 'LOW', { stopType: 'QC', lane: b.lane, legality: qcChk, data: { ...data, averageStint: Math.round((cfg.durationS - us.stintStart - rs.qcLeft * R.qcDurationS) / (rs.qcLeft + 1)) } });
    }
    if (b.delta === 0 && now && qcChk.status !== 'ILLEGAL' && b.kartGain > 0.08) {
      return mk('PIT', conf * clamp(0.7 + margin / 10, 0.7, 1), `Meilleur moment estimé : kart ${data.nextKart || '—'} en tête de file ${b.lane + 1}`, `≈ ${b.kartGain >= 0 ? '+' : ''}${b.kartGain.toFixed(2)} s/tour sur le relais suivant`, b.laneSd > 0.3 ? 'MEDIUM' : 'LOW', { stopType: 'QC', lane: b.lane, legality: qcChk, data });
    }
    if (b.delta > 0 && b.delta <= 300 && b.kartGain > 0.08) {
      return mk('WAIT', conf * 0.85, `Meilleur kart attendu en file ${b.lane + 1} dans ≈ ${Math.round(b.delta / 60)} min`, `≈ ${b.kartGain.toFixed(2)} s/tour si la file évolue comme prévu`, b.pHead != null && b.pHead < 0.5 ? 'HIGH' : 'MEDIUM', { lane: b.lane, data: { ...data, laneHead: laneHead ? laneHead.num : null } });
    }
  }
  // 4. ravitaillement opportun
  if (rs.refuelLeft > 0 && rfChk.status === 'LEGAL') {
    const late = R.refuelWindowEndS - T < 600, early = T - R.refuelWindowStartS > 60;
    const nearRival = A.rivals.some(r => Math.abs(r.netGap) < 4);
    if (early && (late || cfg.objective === 'MINIMIZE_RISK' || !nearRival))
      return mk('PIT', 75 * dq, 'Fenêtre de ravitaillement ouverte, pas de conflit avec un quick-change', 'Obligation réglée, marge de sécurité conservée', 'LOW', { stopType: 'REFUEL', legality: rfChk, data: { refuelClose: Math.round(R.refuelWindowEndS - T) } });
  }
  // 5. adversaires
  const lapsLeft = Math.max(0, (cfg.durationS - T) / st.refLap);
  const ahead = A.rivals.filter(r => r.netGap > 0).sort((a, b) => a.netGap - b.netGap)[0];
  const behind = A.rivals.filter(r => r.netGap <= 0).sort((a, b) => b.netGap - a.netGap)[0];
  const defendThr = cfg.objective === 'DEFEND_POSITION' ? 10 : 5, attackThr = cfg.objective === 'ATTACK_RIVAL' ? 20 : 10;
  if (behind && -behind.netGap < defendThr && behind.paceDelta != null && behind.paceDelta > 0.05)
    return mk('DEFEND', 70 * dq, `${behind.name} revient : ${behind.paceDelta.toFixed(2)} s/tour plus rapide`, `Écart net ${Math.abs(behind.netGap).toFixed(1)} s${behind.catchLaps ? `, rattrapage estimé en ${Math.round(behind.catchLaps)} tours` : ''}`, 'MEDIUM', { data: { rival: behind.name, netGap: r3(behind.netGap), paceDelta: r3(behind.paceDelta) } });
  if (ahead && ahead.netGap < attackThr && ahead.paceDelta != null && ahead.paceDelta < -0.05 && ahead.catchLaps != null && ahead.catchLaps < lapsLeft)
    return mk('ATTACK', 68 * dq, `${ahead.name} à ${ahead.netGap.toFixed(1)} s net, nous sommes ${(-ahead.paceDelta).toFixed(2)} s/tour plus rapides`, `Rattrapage estimé en ${Math.round(ahead.catchLaps)} tours`, 'MEDIUM', { data: { rival: ahead.name, netGap: r3(ahead.netGap), paceDelta: r3(ahead.paceDelta), catchLaps: Math.round(ahead.catchLaps) } });
  if (ahead && ahead.netGap < 3 && ahead.paceDelta != null && Math.abs(ahead.paceDelta) <= 0.05)
    return mk('PUSH', 60 * dq, `${ahead.name} à ${ahead.netGap.toFixed(1)} s, rythmes équivalents`, 'Chaque dixième compte pour passer', 'MEDIUM', { data: { rival: ahead.name, netGap: r3(ahead.netGap) } });
  const nextIn = pw && pw.optimal != null ? Math.round((pw.optimal - T) / 60) : null;
  return mk('KEEP', 65 * dq * (0.6 + 0.4 * sd.currentKartConfidence / 100), 'Rythme stable, pas de meilleure option pour le moment', nextIn === 0 ? 'Arrêt possible dès maintenant, mais aucun kart nettement meilleur en tête de file' : nextIn != null ? `Prochaine fenêtre estimée dans ≈ ${nextIn} min` : 'Aucun arrêt obligatoire imminent', 'LOW', { data: { optimalPitIn: pw && pw.optimal != null ? Math.round(pw.optimal - T) : null } });
}

/* ---------- pipeline d'analyse complet ---------- */
function analyze(race, T, cache) {
  const st = buildState(race, T);
  const validCount = st.teams.reduce((s, t) => s + t.laps.length, 0);
  const key = `${validCount}:${Math.floor(T / 30)}:${JSON.stringify(race.manualRatings)}:${JSON.stringify(race.cfg.rating)}`;
  let rating;
  if (cache && cache.key === key) rating = cache.rating;
  else { rating = rateKarts(race, st); if (cache) { cache.key = key; cache.rating = rating; } }
  const ratingById = {}; rating.karts.forEach(k => { ratingById[k.id] = k; });
  computeStandings(race, st);
  const A = { state: st, rating, ratingById, kartNum: id => (id == null ? null : race.setup.karts[id].num) };
  A.rivals = analyzeRivals(race, st, ratingById);
  A.forecast = forecastKarts(race, st, ratingById);
  A.pitWindow = pitWindow(race, A);
  A.recommendation = strategyAssistant(race, A);
  const finished = st.status === 'FINISHED';
  st.teams.forEach(tm => { tm.compliance = complianceFor(race.cfg, tm, T, finished || tm.finished); });
  A.kartWhere = {};
  st.teams.forEach(tm => { if (tm.kart != null) A.kartWhere[tm.kart] = { status: 'TRACK', team: tm.id }; });
  st.lanes.forEach((l, L) => l.forEach((k, q) => { A.kartWhere[k] = { status: 'LANE', lane: L, q }; }));
  st.maint.forEach(k => { A.kartWhere[k] = { status: 'MAINT' }; });
  return A;
}

/* ---------- branchement simulateur <-> assistant ---------- */
function makeHooks(race, cache) {
  let lastA = null, lastT = -1;
  const get = () => { if (lastT !== race.sim.t || !lastA) { lastA = analyze(race, race.sim.t, cache); lastT = race.sim.t; } return lastA; };
  return {
    ourDecide: () => { const A = get(), r = A.recommendation; return r.action === 'PIT' && r.stopType ? { type: r.stopType, lane: r.lane } : null; },
    laneHeadRatings: () => { const A = lastA || get(); return race.sim.lanes.map(l => (l.length && A.ratingById[l[0]] ? A.ratingById[l[0]].rating : null)); }
  };
}

  return ev;
}

  cfg.ourTeam = ourIdx;

    const name = i === ourIdx ? (cfg.teamNames[0] || r.team || 'Notre équipe') : (r.team || `N° ${r.kart || i + 1}`);
    const ids = [];
    const n = i === ourIdx ? cfg.driversPerTeam : 1;
    for (let j = 0; j < n; j++) { ids.push(drivers.length); drivers.push({ id: drivers.length, name: i === ourIdx ? (cfg.ourDrivers[j] || `Pilote ${j + 1}`) : name, team: i }); }
    return { id: i, name, drivers: ids, row: r.id, number: r.kart || '' };

  const sim = { t: 0, status: 'READY', lanes: deepClone(setup.initialLanes), repairs: [], karts: [], teams: rows.map(() => ({ request: null, finished: false })) };
  const timing = { seq: 0, startAt: null, startEstimated: false, now: null, rate: 1, recvAt: null, connected: false, hasPitInfo: true, nextDriver: null,
    rowToTeam: Object.fromEntries(rows.map((r, i) => [r.id, i])),
    live: teams.map(t => ({ lap: 0, inPit: null, pitThisLap: false, recent: [], ref: null, kart: null, driver: t.drivers[0], qcDone: 0, refuelDone: 0, finished: false, driveTime: {} })),
    pending: [] };
  return { version: 1, mode: 'TIMING', cfg, setup, sim, events: [], buffer: [], link: 'LIVE', autopilot: false, audit: [], manualRatings: {}, seq: 0, timing };
}
function timingNow(race) {

  const base = g.now != null ? g.now + (Date.now() - g.recvAt) * (g.rate || 1) : Date.now();

/* ---------- graphiques SVG ---------- */
function lineChart(series, o = {}) {
  const w = o.w || 640, h = o.h || 220, L = 46, Rr = 10, Tp = 10, B = 24;
  const pts = series.flatMap(s => s.points);
  if (!pts.length) return '<p class="empty">Pas encore de données.</p>';
  let x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));
  let y0 = o.yMin != null ? o.yMin : Math.min(...pts.map(p => p[1])), y1 = o.yMax != null ? o.yMax : Math.max(...pts.map(p => p[1]));
  if (y1 - y0 < 1e-6) { y0 -= 0.5; y1 += 0.5; }
  const py = (y1 - y0) * 0.06; y0 -= py; y1 += py;
  const X = x => L + (x - x0) / (x1 - x0 || 1) * (w - L - Rr), Y = y => Tp + (1 - (y - y0) / (y1 - y0)) * (h - Tp - B);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${L}" x2="${w - Rr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${(o.yFmt || (x => x.toFixed(1)))(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const v = x0 + (x1 - x0) * i / 4; g += `<text x="${X(v)}" y="${h - 6}" text-anchor="middle">${(o.xFmt || (x => Math.round(x)))(v)}</text>`; }
  if (o.zero && y0 < 0 && y1 > 0) g += `<line x1="${L}" x2="${w - Rr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--muted);stroke-dasharray:4 3"/>`;
  const body = series.map(s => s.dots
    ? s.points.map(p => `<path d="M${X(p[0]) - 3},${Y(p[1]) - 3}l6,6m0,-6l-6,6" style="stroke:${s.color};stroke-width:1.6"/>`).join('')
    : `<polyline fill="none" points="${s.points.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}" style="stroke:${s.color};stroke-width:${s.width || 1.8}"/>`).join('');
  const legend = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'Graphique')}">${g}${body}</svg><div class="legend">${legend}</div>`;
}
function barChart(items, o = {}) {
  if (!items.length) return '<p class="empty">Pas encore de données.</p>';
  const w = o.w || 640, rowH = 20, h = items.length * rowH + 24, L = 70, Rr = 50;
  const vals = items.map(i => i.value), vmin = Math.min(0, ...vals), vmax = Math.max(0, ...vals), sp = vmax - vmin || 1;
  const X = v => L + (v - vmin) / sp * (w - L - Rr);
  const bars = items.map((it, i) => {
    const y = 12 + i * rowH, a = X(Math.min(0, it.value)), b = X(Math.max(0, it.value));
    return `<text x="${L - 6}" y="${y + 13}" text-anchor="end">${esc(it.label)}</text><rect x="${a}" y="${y + 3}" width="${Math.max(1, b - a)}" height="${rowH - 6}" style="fill:${it.color || 'var(--ink)'};opacity:${it.opacity == null ? 1 : it.opacity}"/><text x="${b + 4}" y="${y + 13}">${esc(it.text != null ? it.text : it.value.toFixed(2))}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'Graphique')}"><line x1="${X(0)}" x2="${X(0)}" y1="6" y2="${h - 6}" style="stroke:var(--muted)"/>${bars}</svg>`;
}

function moveKart(id, toLane, toIdx) {
  const r = App.race, lanes = KS.deepClone(r.sim.lanes);
  let fromL = -1, fromI = -1;
  lanes.forEach((l, i) => { const j = l.indexOf(id); if (j >= 0) { fromL = i; fromI = j; } });
  if (fromL < 0) return fail('KART_NOT_IN_LANE', `Le kart ${kn(id)} n'est plus en file`);
  if (toLane < 0 || toLane >= lanes.length) return null;
  lanes[fromL].splice(fromI, 1);
  if (toLane === fromL && toIdx > fromI) toIdx--;
  toIdx = KS.clamp(toIdx, 0, lanes[toLane].length);
  lanes[toLane].splice(toIdx, 0, id);
  if (!KS.setLanes(r, lanes)) return fail('INVALID_LANE_STATE', 'Organisation des files incohérente');
  audit('MOVE_KART', `${kn(id)} vers file ${toLane + 1}, position ${toIdx + 1}`);
  App.cache.key = null; refresh();
  return null;
}

function readForm() {
  const cfg = KS.deepClone(App.race.cfg);
  document.querySelectorAll('[data-p]').forEach(inp => {
    const p = inp.dataset.p, t = inp.dataset.t;
    let v = t === 'bool' ? inp.checked : inp.value;
    if (t === 'lane') v = parseInt(v, 10) || 0;
    if (t === 'num' || t === 'int' || t === 'min') { v = parseFloat(String(v).replace(',', '.')); if (!isFinite(v)) return; if (t === 'int') v = Math.round(v); if (t === 'min') v = Math.round(v * 60); }
    setP(cfg, p, v);
  });
  cfg.rivalLane = KS.clamp(cfg.rivalLane | 0, 0, cfg.nLanes - 1);
  cfg.nKarts = cfg.nTeams + cfg.nLanes * cfg.kartsPerLane;
  return cfg;
}
function validateCfg(c) {
  const R = c.rules;
  if (R.stintMinS >= R.stintMaxS) return 'Le relais minimum doit être inférieur au maximum';
  if (R.refuelWindowStartS > R.refuelWindowEndS) return 'La fenêtre de ravitaillement est inversée';
  const n = R.qcCount + 1, need = n * R.stintMinS + R.qcCount * R.qcDurationS, cap = n * R.stintMaxS + R.qcCount * R.qcDurationS;
  if (need > c.durationS || cap < c.durationS) return 'Durée, nombre de quick-change et bornes de relais incompatibles';
  if (!(c.kartsPerLane >= 1) || !(c.nLanes >= 1)) return 'Il faut au moins une file et un kart par file';
  return null;
}

function userPit(type, lane) {
  const r = App.race, A = App.A, us = A.state.teams[r.cfg.ourTeam];
  if (App.replayT != null) return fail('REPLAY_MODE', 'Impossible pendant le replay');
  if (r.sim.status !== 'RUNNING') return fail('RACE_NOT_RUNNING', 'La course n\'est pas en cours');
  const chk = KS.checkAction(r.cfg, us, A.state.T, type);
  if (chk.status === 'ILLEGAL') {
    const code = /court/.test(chk.reasons[0]) ? 'INVALID_STINT_DURATION' : type === 'REFUEL' ? 'INVALID_REFUEL_WINDOW' : 'INVALID_PIT_STOP';
    return fail(code, chk.reasons[0]);
  }
  KS.requestPit(r, type, type === 'QC' ? lane : null);
  audit('CALL_PIT', type === 'QC' ? `Quick-change, file ${lane + 1}` : 'Ravitaillement');
  toast('INFO', 'Arrêt demandé', 'Le pilote rentre au prochain passage.');
  refresh();
  return null;
}
function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v, r = App.race;
  switch (act) {
    case 'pit-apply': { const rec = App.A.recommendation; if (rec.stopType) userPit(rec.stopType, rec.lane != null ? rec.lane : App.laneSel); break; }
    case 'pit-qc': userPit('QC', App.laneSel); break;
    case 'pit-refuel': userPit('REFUEL'); break;

/* ---------- glisser-déposer des files (pointeur, tactile compris) ---------- */
let drag = null;
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const lane = el.closest('.lane'); if (!lane) return null;
  const chip = el.closest('.chip');
  let idx = lane.querySelectorAll('.chip').length;
  if (chip) { const rc = chip.getBoundingClientRect(); idx = +chip.dataset.q + (y > rc.top + rc.height / 2 ? 1 : 0); }
  return { lane: +lane.dataset.lane, idx, laneEl: lane, chip };
}
function clearMarks() { document.querySelectorAll('.lane.over').forEach(x => x.classList.remove('over')); document.querySelectorAll('.drop-before').forEach(x => x.classList.remove('drop-before')); }
function onPointerDown(e) {
  if (App.view !== 'files' || App.replayT != null) return;
  const c = e.target.closest('.chip'); if (!c || e.target.closest('button')) return;
  drag = { c, id: +c.dataset.kart, x: e.clientX, y: e.clientY, started: false };
}
function onPointerMove(e) {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.started = true; App.dragging = true;
    drag.g = drag.c.cloneNode(true); drag.g.classList.add('ghost'); document.body.appendChild(drag.g); drag.c.style.opacity = 0.35;
  }
  e.preventDefault();
  drag.g.style.left = (e.clientX - 100) + 'px'; drag.g.style.top = (e.clientY - 24) + 'px';
  clearMarks();
  const t = dropTarget(e.clientX, e.clientY);
  if (t) { t.laneEl.classList.add('over'); const chips = t.laneEl.querySelectorAll('.chip'); if (chips[t.idx]) chips[t.idx].classList.add('drop-before'); }
}
function onPointerUp(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) return;
  clearMarks(); d.g.remove(); d.c.style.opacity = '';
  App.dragging = false;
  const t = dropTarget(e.clientX, e.clientY);
  if (t) { moveKart(d.id, t.lane, t.idx); toast('INFO', `Kart ${kn(d.id)} déplacé`, `File ${t.lane + 1}.`); }
  else { const fl = document.getElementById('f-lanes'); if (fl) fl._h = null; updateView(); }
}

const NET = (() => {

  if (qs.get('cle')) { try { qs.delete('cle'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); } catch (e) { } }
  let es = null, cb = {}, offset = 0;
  const persist = () => { try { localStorage.setItem(ROOM_KEY, JSON.stringify({ room, key })); } catch (e) { } };
  async function api(method, url, body) {
    let r;
    try { r = await fetch(url, { method, headers: { 'content-type': 'application/json', ...(key ? { 'x-key': key } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
    catch (e) { throw { code: 'NETWORK', message: 'Serveur injoignable : vérifiez le réseau.' }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.code || 'HTTP_' + r.status, message: j.message || 'Erreur serveur ' + r.status, fatal: r.status === 401 || r.status === 404 };
    return j;
  }
  function subscribe() {
    if (es) es.close();
    es = new EventSource(`/api/rooms/${room}/events`);
    es.addEventListener('hello', e => { const d = JSON.parse(e.data); offset = d.now - Date.now(); N.connected = true; cb.onStatus && cb.onStatus(); });
    es.addEventListener('live', e => cb.onLive && cb.onLive(JSON.parse(e.data)));
    es.addEventListener('radio', e => cb.onRadio && cb.onRadio(JSON.parse(e.data)));
    es.addEventListener('replies', e => cb.onReplies && cb.onReplies(JSON.parse(e.data)));
    es.onerror = () => { N.connected = false; cb.onStatus && cb.onStatus(); };
  }
  async function join(code, k) {
    code = String(code || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{4,8}$/.test(code)) throw { code: 'BAD_ROOM', message: 'Code de salle invalide' };
    const prevKey = key; key = k || null;
    let j;
    try { j = await api('GET', `/api/rooms/${code}`); } catch (e) { key = prevKey; throw e; }
    if (k && !j.manager) { key = prevKey; throw { code: 'BAD_KEY', message: 'Clé de team manager incorrecte' }; }
    room = code; N.room = code; N.isOwner = !!j.manager; N.canWrite = !!j.manager; N.hasTiming = !!j.manager; N.shared = true;
    persist(); subscribe();
    if (!k) { const lk = document.querySelector('link[rel="manifest"]'); if (lk) lk.href = 'manifest.webmanifest?salle=' + code; try { history.replaceState(null, '', location.pathname + '?salle=' + code + '&role=pilote'); } catch (e) { } }
    return j;
  }
  function stepH(role, err) {

      ${mgr ? `<button class="rp-btn board" data-net="create"><b>Créer une salle</b><span>Une salle par course. Vous obtiendrez un code à donner aux pilotes.</span></button>

      <label class="small">Code de salle<input type="text" id="netRoom" value="${room || ''}" autocapitalize="characters" autocomplete="off" style="width:100%;font-size:1.4rem;text-transform:uppercase"></label>
      ${mgr ? `<label class="small">Clé de team manager<input type="text" id="netKey" value="${key || ''}" autocomplete="off" style="width:100%"></label>` : ''}
      ${err ? `<p style="color:var(--bad)">${err}</p>` : ''}
      <div class="row"><button class="btn primary" data-net="join">${mgr ? 'Reprendre la salle' : 'Rejoindre'}</button><button class="btn" data-net="back">Retour</button></div></div>`;
  }
  const N = {
    kind: 'server', urlRole: qs.get('role') === 'pilote' ? 'driver' : null, ready: false, shared: false, canWrite: false, isOwner: false, hasTiming: false, connected: false, room: null,
    now: () => Date.now() + offset,
    text: {
      noShared: 'Pas encore relié à une salle : choisissez un rôle et entrez le code de salle.',
      readOnly: 'Lecture seule : il faut la clé de team manager pour envoyer des messages.',
      writeRefused: 'Envoi refusé par le serveur.',
      noTiming: 'La liaison chrono est réservée au team manager (clé de salle).',
      timingOk: 'serveur joignable'
    },
    timingErrors: {},
    async init(callbacks) { cb = callbacks; N.ready = true; },
    async resume(role) {
      if (!room || (role === 'manager' && !key)) return false;
      try { await join(room, role === 'manager' ? key : null); return true; } catch (e) { return false; }
    },
    prepareRole(role) {
      const box = document.getElementById('rolepick');
      return new Promise(resolve => {
        const render = err => { box.classList.remove('hide'); box.innerHTML = stepH(role, err); const i = box.querySelector('#netRoom'); i && !i.value && i.focus(); };
        const done = ok => { box.removeEventListener('click', onClick); resolve(ok); };
        async function onClick(e) {
          const b = e.target.closest('[data-net]'); if (!b) return;
          const a = b.dataset.net;
          if (a === 'back') { done(false); return; }

  document.addEventListener('click', e => {

})();
