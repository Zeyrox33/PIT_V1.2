      <label class="small"><span class="muted">Page live ou adresse wss://</span> <input type="text" id="brUrl" placeholder="https://live.apex-timing.com/…" style="width:min(320px,70vw)" value="${esc(st && st.url || '')}"></label>
      <button class="btn primary" data-act="br-apex" ${NET.hasTiming ? '' : 'disabled'}>Connecter Apex Timing</button>
      <button class="btn" data-act="br-demo" ${NET.hasTiming ? '' : 'disabled'}>Flux de démonstration</button>
      <select id="brSpeed" aria-label="Vitesse de la démo">${[1, 10, 50].map(s => `<option value="${s}">${s}×</option>`).join('')}</select></div>`);
    let raceH;
    if (!timing) {
      raceH = `<h2>Lier la course au chrono</h2>${rows && rows.length ? `<p class="small">Choisissez votre équipe, puis créez la course. Le règlement et le nombre de karts et de files viennent des Réglages.</p>
        <div class="scroll"><table><thead><tr><th></th><th>N°</th><th>Équipe</th><th class="r">Tours</th></tr></thead><tbody>${rows.map(x => `<tr><td><input type="radio" name="ourRow" value="${esc(x.id)}" aria-label="${esc(x.team)}"></td><td>${esc(x.kart)}</td><td>${esc(x.team)}</td><td class="r">${x.laps ?? '—'}</td></tr>`).join('')}</tbody></table></div>
        <div class="row" style="margin-top:8px"><button class="btn board" data-act="br-create">Créer la course depuis le chrono</button></div>` : '<p class="muted">Testez la connexion pour afficher les équipes vues par le chrono.</p>'}`;
    } else {
      const g = r.timing;
      raceH = `<h2>Course chronométrée</h2><dl class="kv"><dt>Dernière réception</dt><dd>${b.lastOk ? Math.round((Date.now() - b.lastOk) / 1000) + ' s' : '—'}</dd><dt>Événements reçus</dt><dd>${g.seq}</dd><dt>Départ</dt><dd>${g.startAt == null ? 'pas encore détecté' : g.startEstimated ? 'estimé (appli ouverte en cours de course)' : 'détecté au premier tour'}</dd><dt>Infos stand dans le flux</dt><dd>${g.hasPitInfo ? 'oui' : 'non : arrêts déduits des tours lents'}</dd></dl>
        <div class="row" style="margin-top:8px">${g.startAt == null ? '<button class="btn board" data-act="br-start">Le départ vient d\'être donné</button>' : ''}<button class="btn" data-act="br-sim">Revenir au simulateur</button></div>
        ${g.pending.length ? `<h3 style="margin-top:12px">Karts pris par les adversaires</h3>${pendingH()}` : ''}`;
    }
    setHTML('ch-race', raceH);
    if (timing) {
      const sts = A.state.teams, opts = sel => `<option value="">—</option>` + r.setup.karts.map(k => `<option value="${k.id}" ${sel === k.id ? 'selected' : ''}>#${pad(k.num)}</option>`).join('');
      setHTML('ch-karts', `<h2>Karts en piste</h2><p class="small muted">À renseigner au départ, puis à corriger si besoin.</p><div class="scroll"><table><tbody>${sts.map(t => `<tr class="${t.id === r.cfg.ourTeam ? 'us' : ''}"><td>${esc(t.name)}</td><td><select data-kartset="${t.id}" aria-label="Kart de ${esc(t.name)}">${opts(t.kart)}</select></td></tr>`).join('')}</tbody></table></div>`);
      setHTML('ch-lanes', `<h2>Composition des files</h2><p class="small muted">Numéros de kart séparés par des virgules, tête de file en premier.</p>${A.state.lanes.map((l, i) => `<label class="row small" style="margin-bottom:6px"><span style="width:52px">File ${i + 1}</span><input type="text" data-lanetxt="${i}" value="${l.map(k => r.setup.karts[k].num).join(', ')}" style="flex:1"></label>`).join('')}<button class="btn primary" data-act="lanes-save">Enregistrer les files</button>`);
    } else { setHTML('ch-karts', '<h2>Karts en piste</h2><p class="muted">Disponible une fois la course liée au chrono.</p>'); setHTML('ch-lanes', '<h2>Composition des files</h2><p class="muted">En simulation, utilisez l\'onglet Files.</p>'); }
    setHTML('ch-help', NET.timingHelpH());
  }
};
function pendingH() {
  const r = App.race, g = r.timing; if (!g || !g.pending.length) return '';
  return `<ul class="notes">${g.pending.map(p => `<li style="border-left-color:var(--warn)"><b>${esc(r.setup.teams[p.team].name)}</b> a changé de kart à ${fmtClock(p.t)}. File prise :<div class="row" style="margin-top:4px">${r.sim.lanes.map((l, i) => `<button class="btn sm" data-act="pend-lane" data-team="${p.team}" data-v="${i}" ${l.length ? '' : 'disabled'}>File ${i + 1}${l.length ? ' (' + kn(l[0]) + ')' : ''}</button>`).join('')}</div></li>`).join('')}</ul>`;
}

/* ---------- ajouts à l'interface existante ---------- */
const _ctlH = ctlH;
ctlH = function (A) {
  const r = App.race;
  let h = _ctlH(A);
  if (r.mode === 'TIMING') {
    h = h.replace(/<label[^>]*><input type="checkbox" id="autopilot"[\s\S]*?<\/label>/, '');
    const us = A.state.teams[r.cfg.ourTeam], next = r.timing.nextDriver;
    h += `<label class="row small" style="margin-top:8px"><span class="muted">Prochain pilote</span> <select id="nextDrv">${'<option value="">Auto (moins de temps de volant)</option>' + us.drivers.filter(d => d !== us.driver).map(d => `<option value="${d}" ${next === d ? 'selected' : ''}>${esc(r.setup.drivers[d].name)}</option>`).join('')}</select></label>`;
    if (r.timing.pending.length) h += `<h3 style="margin-top:10px">À renseigner</h3>${pendingH()}`;
  }
  return h;
};
const _courseShell = VIEWS.course.shell, _courseUpdate = VIEWS.course.update;
VIEWS.course.shell = () => _courseShell().replace('<section class="panel d-live"', '<section class="panel d-radio" id="s-radio"></section><section class="panel d-live"');
VIEWS.course.update = A => { _courseUpdate(A); setHTML('s-radio', radioPanelH(true)); };
const _renderTop = renderTop;
renderTop = function () {
  _renderTop();
  const r = App.race, run = document.getElementById('btnRun'), sp = document.getElementById('speed');
  if (r.mode === 'TIMING') {
    const s = r.sim.status, txt = s === 'READY' ? 'Départ donné' : s === 'RUNNING' ? 'Chrono en direct' : 'Terminée';
    if (run.textContent !== txt) run.textContent = txt;
    run.disabled = s !== 'READY' || App.replayT != null;
    if (sp) sp.closest('label').classList.add('hide');
  } else if (sp) sp.closest('label').classList.remove('hide');
};
const _userPit = userPit;
userPit = function (type, lane) {
  const err = _userPit(type, lane);
  if (!err && NET.shared && NET.canWrite !== false) sendRadio(type === 'QC' ? 'BOX' : 'BOX', type === 'QC' ? `Rentre ce tour : quick-change${lane != null && App.race.cfg.rules.kartChangeOnQC ? ', file ' + (lane + 1) : ''}` : 'Rentre ce tour : ravitaillement');
  return err;
};
const _moveKart = moveKart;
moveKart = function (id, toLane, toIdx) {
  const r = App.race;
  if (r.mode !== 'TIMING') return _moveKart(id, toLane, toIdx);
  const lanes = KS.deepClone(r.sim.lanes);
  let fL = -1, fI = -1; lanes.forEach((l, i) => { const j = l.indexOf(id); if (j >= 0) { fL = i; fI = j; } });
  if (fL < 0 || toLane < 0 || toLane >= lanes.length) return null;
  lanes[fL].splice(fI, 1); if (toLane === fL && toIdx > fI) toIdx--;
  lanes[toLane].splice(KS.clamp(toIdx, 0, lanes[toLane].length), 0, id);
  const res = KS.setLanesFree(r, lanes); if (res.error) return fail(res.error.code, res.error.message);
  audit('MOVE_KART', `${kn(id)} vers file ${toLane + 1}`); App.cache.key = null; refresh();
  return null;
};
const _onClick = onClick;
onClick = function (e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return _onClick(e);
  const act = b.dataset.act, r = App.race;
  switch (act) {
    case 'radio-q': { const q = QUICK.find(x => x[0] === b.dataset.v); if (q) sendRadio(q[0], q[1]); return; }
    case 'radio-send': { const i = document.getElementById('radioTxt'); if (i && i.value.trim()) { sendRadio('FREE', i.value); i.value = ''; } return; }
    case 'br-status': bridgeStatus(); return;
    case 'br-demo': bridgeConnect('demo', '', +(document.getElementById('brSpeed') || {}).value || 1); return;
    case 'br-apex': { const u = (document.getElementById('brUrl') || {}).value || ''; if (!/^(https?|wss?):\/\//.test(u.trim())) return fail('INVALID_URL', 'Collez l\'adresse de la page live (https://…) ou du flux (wss://…)'); bridgeConnect('apex', u.trim()); return; }
    case 'br-create': createFromTiming(); return;
    case 'br-start': KS.timingStart(r); audit('START_RACE', 'Départ manuel (chrono)'); refresh(); return;
    case 'br-sim': if (confirm('Quitter la course chronométrée et revenir au simulateur ?')) { newRace(KS.deepClone(r.cfg)); ensureRaceId(App.race); mountView(); refresh(); } return;
    case 'pend-lane': { const res = KS.assignRivalKart(r, +b.dataset.team, +b.dataset.v); if (res.error) return fail(res.error.code, res.error.message); audit('MOVE_KART', `${r.setup.teams[+b.dataset.team].name} : ${kn(res.kart)} (file ${+b.dataset.v + 1})`); App.cache.key = null; refresh(); updateView(); return; }
    case 'lanes-save': {
      const lanes = [...document.querySelectorAll('[data-lanetxt]')].map(i => i.value.split(/[,;\s]+/).filter(Boolean).map(x => { const k = r.setup.karts.find(kk => String(kk.num) === x.replace('#', '')); return k ? k.id : -1; }));
      const res = KS.setLanesFree(r, lanes); if (res.error) return fail(res.error.code, res.error.message);
      audit('MOVE_KART', 'Files saisies'); App.cache.key = null; toast('INFO', 'Files enregistrées', ''); refresh(); updateView(); return;
    }
    case 'role-manager': setRole('manager'); return;
    case 'role-driver': setRole('driver'); return;
    default: return _onClick(e);
  }
};
const _onChange = onChange;
onChange = function (e) {
  const el = e.target, r = App.race;
  if (el.id === 'nextDrv') { r.timing.nextDriver = el.value === '' ? null : +el.value; audit('CHANGE_STRATEGY', 'Prochain pilote choisi'); return; }
  if (el.dataset && el.dataset.kartset != null) { if (el.value === '') return; KS.setTeamKart(r, +el.dataset.kartset, +el.value); audit('MOVE_KART', `${r.setup.teams[+el.dataset.kartset].name} sur ${kn(+el.value)}`); App.cache.key = null; refresh(); updateView(); return; }
  return _onChange(e);
};
const _settingsShell = VIEWS.reglages.shell;
VIEWS.reglages.shell = () => _settingsShell() + `<section class="panel" style="margin-top:12px"><h2>Rôle de cet écran</h2><p class="small muted">Actuellement : ${App.role === 'driver' ? 'pilote' : 'team manager'}.</p><div class="row"><button class="btn" data-act="role-driver">Passer en écran pilote</button></div></section>`;

/* ---------- mode pilote : pas d'alertes de l'appli, seulement les messages du stand ---------- */
const _toast = toast;
toast = function (sev, title, body) { if (App.role === 'driver') return; _toast(sev, title, body); };
const _note = note;
note = function (key, sev, title, body) { if (App.role === 'driver') return; _note(key, sev, title, body); };
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { if (App.role === 'driver') { if (fsEl()) keepAwake(); renderDriver(); } }));
window.addEventListener('resize', () => { if (App.role === 'driver') { const d = document.getElementById('driver'); if (d) d._h = null; renderDriver(); } });

/* ---------- démarrage ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-role],[data-act]'); if (!b) return;
  if (b.dataset.role) { setRole(b.dataset.role); return; }
  if (!b.closest('#driver')) return;
  const act = b.dataset.act;
  if (act === 'drv-pick') { App.driverIdx = +b.dataset.v; lsSet(DRV_KEY, String(App.driverIdx)); unlockAudio(); keepAwake(); renderDriver(); }
  else if (act === 'dv-fs') { App.fsAsked = true; App.dvMenu = false; goFullscreen().then(renderDriver); renderDriver(); }
  else if (act === 'dv-fs-exit') { App.dvMenu = false; try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (er) { } renderDriver(); }
  else if (act === 'dv-later') { App.fsAsked = true; try { sessionStorage.setItem('kart-fs-asked', '1'); } catch (er) { } unlockAudio(); keepAwake(); renderDriver(); }
  else if (act === 'dv-menu') { App.dvMenu = true; renderDriver(); }
  else if (act === 'dv-menu-close') { App.dvMenu = false; renderDriver(); }
  else if (act === 'drv-change') { App.driverIdx = null; App.dvMenu = false; renderDriver(); }
  else if (act === 'drv-ack' || act === 'drv-reply') { unlockAudio(); driverReply(b.dataset.v, act === 'drv-ack' ? latestForMe() : null); }
  else if (act === 'role-switch') { App.dvMenu = false; App.role = null; lsSet(ROLE_KEY, ''); document.body.classList.remove('driver-mode'); showRolePicker(); }
  else if (act === 'wake') { keepAwake().then(renderDriver); unlockAudio(); }
});
document.addEventListener('submit', e => { if (e.target.closest('[data-form="radio"]')) { e.preventDefault(); const i = document.getElementById('radioTxt'); if (i && i.value.trim()) { sendRadio('FREE', i.value); i.value = ''; } } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && App.role === 'driver') { App.wake = null; keepAwake(); } });
if (App.role === 'driver') document.body.classList.add('driver-mode');
setInterval(pollBridge, 2500);
setTimeout(initCaps, 0);

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
